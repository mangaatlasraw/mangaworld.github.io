name: Copy chapter images from old site

on:
  push:
    paths:
      - ".github/workflows/copy-chapter-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-chapter-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new site
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy all chapter image assets
        run: |
          git clone --depth 1 https://github.com/mangaatlasraw/mangaatlasraw.github.io.git /tmp/old-site
          mkdir -p chapter-images
          cp -a /tmp/old-site/chapter-images/. chapter-images/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapter-images
          if git diff --cached --quiet; then
            echo "No chapter image changes to commit."
          else
            git commit -m "Copy chapter images from old site"
            git push origin main
          fi
